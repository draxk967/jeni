<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050406">
    <meta name="color-scheme" content="dark">

    <title>Chat</title>

    <link rel="stylesheet" href="/styles.css">
  </head>

  <body>
    <div class="tg-app">
      <main class="tg-chat" aria-label="Conversa">
        <header class="topbar">
          <button class="topbar-peer-button" type="button" aria-label="Informações do contato">
            <div class="topbar-peer" aria-live="polite">
              <div id="chat-title" class="topbar-title">Putinha da Roça</div>
              <div class="topbar-subtitle"></div>
            </div>
          </button>

          <button class="topbar-avatar" type="button" aria-label="Foto do perfil">
            <img src="https://i.imgur.com/2rRlZ3Q.png" alt="">
          </button>
        </header>

        <section
          id="chat-body"
          class="chat-body bubbles"
          aria-live="polite"
          aria-label="Mensagens da conversa"
        ></section>

        <!-- Mantém o botão no DOM para o app.js não quebrar, mas ele fica invisível -->
        <button
          id="restart-flow"
          class="restart-flow-hidden"
          type="button"
          aria-hidden="true"
          tabindex="-1"
        ></button>

<footer class="chat-input-wrapper" aria-label="Barra de mensagem">
  <div class="chat-input">
    <input
      id="message-input"
      class="chat-message-field"
      type="text"
      placeholder="Message"
      autocomplete="off"
    >

    <button class="chat-input-emoji" type="button" aria-label="Emoji">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.8a9.2 9.2 0 1 0 0 18.4 9.2 9.2 0 0 0 0-18.4Zm0 16.8a7.6 7.6 0 1 1 0-15.2 7.6 7.6 0 0 1 0 15.2ZM8.7 10a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4Zm6.6 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4Zm.8 3.1a.8.8 0 0 1 .1 1.1A5.2 5.2 0 0 1 12 16.3a5.2 5.2 0 0 1-4.2-2.1.8.8 0 1 1 1.2-1 3.7 3.7 0 0 0 3 1.5 3.7 3.7 0 0 0 3-1.5.8.8 0 0 1 1.1-.1Z"></path>
      </svg>
    </button>
  </div>

  <button id="send-message" class="chat-input-send" type="button" aria-label="Enviar mensagem">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 15.4a3.4 3.4 0 0 0 3.4-3.4V6.3a3.4 3.4 0 0 0-6.8 0V12a3.4 3.4 0 0 0 3.4 3.4Zm5.7-3.4a.8.8 0 1 0-1.6 0 4.1 4.1 0 0 1-8.2 0 .8.8 0 1 0-1.6 0 5.8 5.8 0 0 0 5 5.7v2H8.9a.8.8 0 1 0 0 1.6h6.2a.8.8 0 1 0 0-1.6h-2.3v-2a5.8 5.8 0 0 0 4.9-5.7Z"></path>
    </svg>
  </button>
</footer>

<button
  id="restart-flow"
  class="restart-flow-hidden"
  type="button"
  aria-hidden="true"
  tabindex="-1"
></button>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>

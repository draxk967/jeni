<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050406">
    <meta name="color-scheme" content="dark">

    <title>Chat</title>

    <link rel="stylesheet" href="/styles.css">
  </head>

  <body>
    <div class="tg-app">
      <main class="tg-chat" aria-label="Conversa">
        <header class="topbar">
          <button class="topbar-peer-button" type="button" aria-label="Informações do contato">
            <div class="topbar-peer" aria-live="polite">
              <div id="chat-title" class="topbar-title">Putinha da Roça</div>
              <div class="topbar-subtitle"></div>
            </div>
          </button>

          <button class="topbar-avatar" type="button" aria-label="Foto do perfil">
            <img src="https://i.imgur.com/2rRlZ3Q.png" alt="">
          </button>
        </header>

        <section
          id="chat-body"
          class="chat-body bubbles"
          aria-live="polite"
          aria-label="Mensagens da conversa"
        ></section>

        <!-- Mantém o botão no DOM para o app.js não quebrar, mas ele fica invisível -->
        <button
          id="restart-flow"
          class="restart-flow-hidden"
          type="button"
          aria-hidden="true"
          tabindex="-1"
        ></button>

<footer class="chat-input-wrapper" aria-label="Barra de mensagem">
  <div class="chat-input">
    <input
      id="message-input"
      class="chat-message-field"
      type="text"
      placeholder="Digite uma mensagem"
      autocomplete="off"
    >

    <button class="chat-input-emoji" type="button" aria-label="Emoji">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.8a9.2 9.2 0 1 0 0 18.4 9.2 9.2 0 0 0 0-18.4Zm0 16.8a7.6 7.6 0 1 1 0-15.2 7.6 7.6 0 0 1 0 15.2ZM8.7 10a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4Zm6.6 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4Zm.8 3.1a.8.8 0 0 1 .1 1.1A5.2 5.2 0 0 1 12 16.3a5.2 5.2 0 0 1-4.2-2.1.8.8 0 1 1 1.2-1 3.7 3.7 0 0 0 3 1.5 3.7 3.7 0 0 0 3-1.5.8.8 0 0 1 1.1-.1Z"></path>
      </svg>
    </button>
  </div>

  <button id="send-message" class="chat-input-send" type="button" aria-label="Gravar áudio">
    <span class="chat-input-send-icon icon icon-mic" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 14 0h-2Zm-5 9a1 1 0 0 0 1-1v-2h-2v2a1 1 0 0 0 1 1Zm5-3.5a1 1 0 0 0-2 0A3 3 0 0 1 12 18a3 3 0 0 1-3-3.5 1 1 0 0 0-2 0A5 5 0 0 0 12 20a5 5 0 0 0 5-5.5Z"></path>
      </svg>
    </span>
    <span class="chat-input-send-icon icon icon-send hidden" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 4l8 8h-6v8h-4v-8H4l8-8z"></path>
      </svg>
    </span>
  </button>
</footer>

<button
  id="restart-flow"
  class="restart-flow-hidden"
  type="button"
  aria-hidden="true"
  tabindex="-1"
></button>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
